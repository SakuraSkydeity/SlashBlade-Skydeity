# Gradle 内存设置
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# 若需要自动下载特定 JDK，可在此指定 Toolchain 路径
# org.gradle.java.installations.paths=C:/Program Files/Eclipse Adoptium/java-21.0.3-delta

# Minecraft / Forge 版本（Forge 1.20.1 官方推荐 47.4.10 / 47.2.0）
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
minecraftVersionFiltering=1.20.1
forge_version=47.4.10
forge_version_range=[47.0,)
loader_version_range=[1,)

# 模组信息
mod_id=skydeityslash
mod_name=SlashBlade Skydeity
mod_license=MIT
mod_version=1.0.0
mod_group_id=com.example
mod_authors=sakuraskydeity
mod_description=SlashBlade Skydeity — a SlashBlade Resharpened 1.20.1 Forge companion

# 拔刀剑依赖版本（MMMaven，Forge 1.20.1 用 1.5.x 分支）
slashblade_version=1.5.49

# JEI / EMI 合成表显示支持（编译期可选依赖，运行时无 JEI/EMI 也能加载）
jei_version=15.2.0.27
emi_version=1.1.20+1.20.1